name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the project version"
        required: true
        default: "v0.10.0"
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vendor-replay:
    name: cryptonite patch replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Replay patch queue from pristine upstream
        shell: pwsh
        run: pwsh -File scripts/verify-cryptonite-patches.ps1

  build-linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            multilib: ""
            vcpkg_triplet: x64-linux
          - arch: x86
            multilib: "gcc-13-multilib g++-13-multilib libc6-dev-i386 linux-libc-dev:i386"
            vcpkg_triplet: x86-linux
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            uuid-dev nasm yasm ${{ matrix.multilib }}

      - name: Bootstrap vcpkg (порти ставить manifest-режим під час configure)
        run: |
          vcpkg_baseline="$(grep -o '"builtin-baseline"[[:space:]]*:[[:space:]]*"[0-9a-f]\{40\}"' vcpkg.json | grep -o '[0-9a-f]\{40\}')"
          if [ -z "$vcpkg_baseline" ]; then
            echo "vcpkg.json: builtin-baseline не знайдено" >&2
            exit 1
          fi
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-}"
          if [ -z "$vcpkg_root" ]; then
            vcpkg_root="$RUNNER_TEMP/vcpkg"
            git clone https://github.com/microsoft/vcpkg "$vcpkg_root"
            git -C "$vcpkg_root" checkout --quiet "$vcpkg_baseline"
            "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - name: Build (Release)
        run: >
          bash scripts/build-linux.sh
          --arch ${{ matrix.arch }}
          --config Release
          --tests
          --static-third-party-deps
          --vcpkg-triplet ${{ matrix.vcpkg_triplet }}

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          b="build-${{ matrix.arch }}-release"
          strip --strip-unneeded "$b/libTamga.so" "$b/libtamga-lib.so" "$b/src/cli/tamga-cli"
          cp "$b/libTamga.so"       "dist/libTamga-linux-${{ matrix.arch }}.so"
          cp "$b/libtamga-lib.so"   "dist/libtamga-lib-linux-${{ matrix.arch }}.so"
          cp "$b/src/cli/tamga-cli" "dist/tamga-cli-linux-${{ matrix.arch }}"
          ls -la dist

      - name: SBOM + link-map
        shell: pwsh
        run: >
          pwsh -File scripts/generate-sbom.ps1
          -BuildDir build-${{ matrix.arch }}-release
          -OutDir sbom
          -Triplet ${{ matrix.vcpkg_triplet }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamga-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamga-sbom-${{ matrix.vcpkg_triplet }}
          path: sbom/*
          if-no-files-found: error

  build-windows:
    name: windows-${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            vcpkg_triplet: x64-windows-static
          - arch: x86
            cmake_arch: Win32
            vcpkg_triplet: x86-windows-static
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-msvc-${{ matrix.arch }}
          -G "Visual Studio 17 2022"
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DVCPKG_MANIFEST_MODE=ON
          -DVCPKG_MANIFEST_FEATURES="xml-signatures;pdf-signatures"
          -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON
          -DTAMGA_ENABLE_VENDOR_CRYPTONITE=ON
          -DTAMGA_ENABLE_XML_SIGNATURES=ON
          -DTAMGA_ENABLE_PDF_SIGNATURES=ON
          -DTAMGA_BUILD_TESTS=ON
          -DTAMGA_BUILD_CLI=ON

      - name: Assert both format engines are enabled
        shell: pwsh
        run: |
          $log = cmake -S . -B build-msvc-${{ matrix.arch }} -LA 2>&1 | Out-String
          if ($log -notmatch 'TAMGA_ENABLE_XML_SIGNATURES:BOOL=ON') { throw "XMLDSIG engine is OFF" }
          if ($log -notmatch 'TAMGA_ENABLE_PDF_SIGNATURES:BOOL=ON') { throw "PAdES engine is OFF" }

      - name: Build Release
        run: cmake --build build-msvc-${{ matrix.arch }} --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build-msvc-${{ matrix.arch }} -C Release --output-on-failure

      - name: Smoke gate
        shell: pwsh
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts\build-windows-smoke.ps1
          -BuildDir build-msvc-${{ matrix.arch }}
          -Configuration Release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build-msvc-${{ matrix.arch }}\Release\Tamga.dll" dist\Tamga.dll -Force
          Copy-Item "build-msvc-${{ matrix.arch }}\Release\tamga-lib.dll" dist\tamga-lib.dll -Force
          Copy-Item "build-msvc-${{ matrix.arch }}\src\cli\Release\tamga-cli.exe" dist\tamga-cli.exe -Force
          Compress-Archive -Path dist\* -DestinationPath "tamga-windows-${{ matrix.arch }}.zip" -Force
          Get-ChildItem dist
          Get-Item "tamga-windows-${{ matrix.arch }}.zip"

      - name: SBOM + link-map (x64, зі звіркою notices)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: >
          pwsh -File scripts/generate-sbom.ps1
          -BuildDir build-msvc-${{ matrix.arch }}
          -OutDir sbom
          -Triplet ${{ matrix.vcpkg_triplet }}
          -CheckNotices

      - name: SBOM + link-map (x86)
        if: matrix.arch != 'x64'
        shell: pwsh
        run: >
          pwsh -File scripts/generate-sbom.ps1
          -BuildDir build-msvc-${{ matrix.arch }}
          -OutDir sbom
          -Triplet ${{ matrix.vcpkg_triplet }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamga-windows-${{ matrix.arch }}
          path: tamga-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamga-sbom-${{ matrix.vcpkg_triplet }}
          path: sbom/*
          if-no-files-found: error

  release:
    name: publish-release
    needs: [vendor-replay, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (ліцензійний комплект)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Prepare and verify four-platform package
        run: python3 scripts/prepare-release.py --artifacts artifacts --out release-files --commit "$GITHUB_SHA"

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('vcpkg.json').read_text())['version']
          tag = os.environ['INPUT_TAG'] if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' else os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v' + re.escape(version) + r'(?:-[A-Za-z0-9.-]+)?', tag):
              raise SystemExit('Release tag must match vcpkg.json version')
          prerelease = os.environ.get('INPUT_PRERELEASE', 'false') if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' else ('true' if '-' in tag else 'false')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nprerelease={prerelease}\n')
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            NativeAPI-компонента для Windows і Linux, x86 та x64, з XML/XAdES і PDF/PAdES рушіями.

            Для 1С/BAS завантажте `Tamga.zip` (чотири компоненти та MANIFEST.XML) і `Tamga-licenses.zip` (повні ліцензійні матеріали).
            Окремі бінарники, CLI, SBOM для кожної архітектури та `SHA256SUMS.txt` додано нижче.
            `release-manifest.json` містить commit джерел і hashes компонентів. Архітектуру PE/ELF та відповідність пакета збіркам перевірено автоматично.

            Linux-профіль зібрано без HTTP backend: онлайн-запити TSP/OCSP/CRL недоступні. Windows використовує WinHTTP.
          files: release-files/*
