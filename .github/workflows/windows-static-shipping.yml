name: windows-static-shipping

# Автономна shipping-збірка з XML/PDF, публічним CTest і перевіркою single-DLL.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-shipping:
    name: windows-x64-static (XMLDSIG + PAdES)
    runs-on: windows-2022

    env:
      VCPKG_TRIPLET: x64-windows-static
      BUILD_DIR: build-static

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        # Manifest-режим: склад залежностей береться з `vcpkg.json`,
        # а `VCPKG_MANIFEST_FEATURES` вмикає рівно ті фічі, які
        # відповідають увімкненим рушіям нижче. Якщо ці два переліки
        # колись розійдуться, впаде крок "Assert both engines are
        # enabled": CMake тихо вимкне рушій, не знайшовши бібліотеки.
        run: >
          cmake -S . -B $env:BUILD_DIR
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_MODE=ON
          -DVCPKG_MANIFEST_FEATURES="xml-signatures;pdf-signatures"
          -DTAMGA_ENABLE_VENDOR_CRYPTONITE=ON
          -DTAMGA_ENABLE_XML_SIGNATURES=ON
          -DTAMGA_ENABLE_PDF_SIGNATURES=ON
          -DTAMGA_BUILD_TESTS=ON
          -DTAMGA_BUILD_CLI=ON
          -DTAMGA_BUILD_TOOLS=ON

      # Доказ, що дерево залежностей справді належить цій збірці.
      # Раніше ця перевірка стояла ПЕРЕД конфігурацією і дивилася на
      # дерево, яке CMake ще навіть не бачив; тепер вона дивиться на те,
      # що конфігурація реально використала.
      - name: Verify manifest-installed dependencies
        shell: pwsh
        run: |
          $root = "$env:BUILD_DIR/vcpkg_installed/$env:VCPKG_TRIPLET"
          Write-Host "manifest prefix : $root"
          if (-not (Test-Path $root)) { throw "manifest prefix not found: $root" }
          foreach ($lib in @('libxml2.lib', 'qpdf.lib')) {
            if (-not (Test-Path "$root/lib/$lib")) { throw "missing expected static library: $lib" }
          }
          if (-not (Test-Path "$root/share/zlib")) { throw "vcpkg share/zlib is missing" }

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --parallel

      # Обидва рушії мусять бути справді ввімкнені: якщо CMake їх тихо вимкне
      # (не знайшов libxml2/qpdf), тести нижче просто не існуватимуть, і job
      # став би зеленим, нічого не перевіривши. Це рівно та пастка, через яку
      # interop-сюїта й не виконувалась.
      - name: Assert both engines are enabled
        shell: pwsh
        run: |
          $log = cmake -S . -B $env:BUILD_DIR -LA 2>&1 | Out-String
          if ($log -notmatch 'TAMGA_ENABLE_XML_SIGNATURES:BOOL=ON') { throw "XMLDSIG engine is OFF" }
          if ($log -notmatch 'TAMGA_ENABLE_PDF_SIGNATURES:BOOL=ON') { throw "PAdES engine is OFF" }
          $tests = ctest --test-dir $env:BUILD_DIR -N | Out-String
          foreach ($t in @('tamga-xmldsig-security-tests','tamga-pades-security-tests')) {
            if ($tests -notmatch [regex]::Escape($t)) { throw "gated suite missing: $t" }
          }
          Write-Host $tests

      - name: Run full CTest
        shell: pwsh
        run: ctest --test-dir $env:BUILD_DIR --output-on-failure

      # Перевірки приватного interop-корпусу запускаються у приватному workspace.

      # Single-DLL: жодної сторонньої залежності. libxml2/qpdf/zlib/jpeg/iconv і
      # MSVC CRT мають бути ВСЕРЕДИНІ. Список дозволених — лише системні DLL.
      - name: Assert single-DLL (no third-party dependencies)
        shell: pwsh
        run: |
          $dll = Join-Path $env:BUILD_DIR 'Tamga.dll'
          if (-not (Test-Path $dll)) { throw "Tamga.dll not found at $dll" }
          # Перелік системних DLL Windows. Сенс перевірки — спіймати
          # ТРЕТЬОСТОРОННЮ залежність (runtime vcpkg, libxml2.dll тощо), а не
          # будь-яку нову: `Tamga.dll` має лишатися single-DLL, придатною до
          # копіювання поруч із обробкою 1С без супутніх файлів.
          #
          # WS2_32.dll — Winsock, постачається з самою ОС. Потрібен для
          # `getaddrinfo`/`WSAStartup` у `ResolveSystemHost`
          # (`src/lib/core/HttpClient.cpp`), тобто для перевірки призначення в
          # політиці SSRF: без резолву імені немає що класифікувати. Залежність
          # прийшла ще з `a8a590b`, але цей крок падав раніше на triplet і до
          # перевірки не доходив — тобто пропуск у переліку, а не регресія.
          $allowed = @(
            'KERNEL32.dll','ADVAPI32.dll','WINHTTP.dll','bcrypt.dll',
            'CRYPT32.dll','WLDAP32.dll','WS2_32.dll',
            'USER32.dll','ole32.dll','OLEAUT32.dll'
          )
          $deps = (dumpbin /DEPENDENTS $dll | Select-String -Pattern '^\s{4}\S+\.dll$').Matches.Value.Trim()
          Write-Host "Dependencies:`n$($deps -join "`n")"
          $bad = $deps | Where-Object { $allowed -notcontains $_ }
          if ($bad) { throw "Tamga.dll gained non-system dependencies: $($bad -join ', ')" }

      - name: Smoke NativeAPI exports
        shell: pwsh
        run: scripts/build-windows-smoke.ps1 -BuildDir $env:BUILD_DIR -Configuration Release
